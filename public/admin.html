<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{font:14px system-ui;background:#111;color:#eee;padding:14px}td,th{padding:4px 8px;border-bottom:1px solid #444;text-align:left}.bad{color:#ff6b6b}pre{background:#000;padding:8px;max-height:300px;overflow:auto}</style>
<h2>🛡️ Admin</h2><input id=t type=password placeholder="ADMIN_TOKEN"> <button onclick="go()">Entrar</button>
<h3>☢️ Reset geral</h3><button onclick="if(prompt('Apaga TODO o progresso de TODOS (as contas/logins ficam). Digite RESET:')==='RESET')api('reset',{confirm:'RESET'}).then(j=>alert(j.ok?'Resetado. Todos recomeçam do zero.':'Erro')).then(go)" style="background:#900;color:#fff">Resetar progresso de todos</button><h3>⚠️ Alertas</h3><div id=a></div><h3>👥 Usuários</h3><div id=u></div><h3>🆔 Buscar ID de item</h3><input id=q placeholder='ID-XXXX-XXXX-XXXX-XXXX'> <button onclick="fi()">Buscar</button> <span id=qr></span><h3>💎 Creditar (compras Pix)</h3><input id=cu placeholder='id do usuário' size=8> <input id=cd placeholder=diamantes size=8> <input id=co placeholder=oricalco size=8> <input id=cn placeholder='nota/Pix' size=14> <button onclick="cr()">Creditar</button> <span id=cm></span><h3>🕘 Histórico de saves</h3><input id=hu placeholder='id do usuário' size=8> <button onclick="hs()">Ver</button><div id=hl></div><h3>Inventário</h3><pre id=i>clique em um usuário</pre>
<script>
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let T='';
const api=(p,b)=>fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'x-admin':T,'content-type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
async function go(){T=document.getElementById('t').value;const al=await api('alerts'),us=await api('users');if(!Array.isArray(us))return alert('Token inválido');
a.innerHTML=al.length?'<table>'+al.map(x=>`<tr><td>${E(x.name)}</td><td class=bad>${E(x.msg)}</td><td>${new Date(x.at).toLocaleString()}</td><td><button onclick="api('clear',{id:${x.id}}).then(go)">Limpar</button></td></tr>`).join('')+'</table>':'Nenhum alerta.';
u.innerHTML='<table><tr><th>Login<th>Nível máx<th>Chars<th>Ouro<th>Oricalco<th>Fase<th>Ações'+us.map(x=>`<tr><td><a href=# onclick="inv(${x.id});return false">${E(x.name)}</a>${x.banned?' 🚫':''}${x.locked?' 🔒':''}${x.dev?' 🛠️DEV':''}<td>${x.maxLv??'-'}<td>${x.chars??'-'}<td>${x.gold??'-'}<td>${x.orc??'-'}<td>${x.stage??'-'}<td><button onclick="api('ban',{id:${x.id},ban:${x.banned?0:1}}).then(go)">${x.banned?'Desbanir':'Banir'}</button> <button onclick="rp(${x.id})">Redefinir senha</button> ${x.locked?`<button onclick="api('unlock',{id:${x.id}}).then(go)">🔓 Liberar</button>`:''} <button onclick="api('dev',{id:${x.id},dev:${x.dev?0:1}}).then(go)">${x.dev?'Tirar DEV':'Marcar DEV'}</button>`).join('')+'</table>'}
async function inv(id){i.textContent=JSON.stringify(await fetch('/api/admin/inventory?id='+id,{headers:{'x-admin':T}}).then(r=>r.json()),null,1)}
async function fi(){const j=await api('item?uid='+encodeURIComponent(q.value));qr.textContent=j.error||('Dono: '+(j.name||j.owner)+' · tipo '+j.kind+(j.gone?' · JÁ GASTO/VENDIDO':'')+' · visto em '+new Date(j.at).toLocaleString())}
async function cr(){const j=await api('credit',{id:+cu.value,dia:+cd.value,orc:+co.value,note:cn.value});cm.textContent=j.ok?'Creditado (aplica no próximo envio do jogador)':(j.error||'erro')}
async function hs(){const l=await api('history?id='+(+hu.value));hl.innerHTML=Array.isArray(l)&&l.length?'<table>'+l.map(x=>`<tr><td>${new Date(x.at).toLocaleString()}<td>${x.len} bytes<td><button onclick="rs(${+hu.value},${x.id})">Restaurar</button>`).join('')+'</table>':'Sem histórico.'}
async function rs(id,hid){if(confirm('Restaurar este save? A conta fica travada até você clicar em Liberar.')){const j=await api('restore',{id,hid});alert(j.ok?j.note:'Erro');go()}}
async function rp(id){const p=prompt('Nova senha (8+):');if(p)alert((await api('resetpass',{id,pass:p})).ok?'Ok':'Erro')}
</script>
